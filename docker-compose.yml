services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: smart-water-map-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_water_map
      POSTGRES_USER: smart_water
      POSTGRES_PASSWORD: smart_water_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_water -d smart_water_map"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: smart-water-map-migrate
    environment:
      DATABASE_URL: postgresql://smart_water:smart_water_password@postgres:5432/smart_water_map?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run deploy:migrations && npm run seed:if-empty"]
    restart: "no"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: smart-water-map-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://smart_water:smart_water_password@postgres:5432/smart_water_map?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5174
      AFRICASTALKING_API_KEY: ""
      AFRICASTALKING_USERNAME: sandbox
    ports:
      - "4001:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: smart-water-map-seed
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgresql://smart_water:smart_water_password@postgres:5432/smart_water_map?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "seed"]
    restart: "no"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: "http://localhost:4001/api/v1"
        VITE_SOCKET_URL: "http://localhost:4001"
        VITE_MAP_TILE_URL: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    container_name: smart-water-map-client
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
