services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_water_map}
      POSTGRES_USER: ${POSTGRES_USER:-smart_water}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smart_water} -d $${POSTGRES_DB:-smart_water_map}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: bitnami/pgbouncer:1.24.1
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-smart_water_map}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-smart_water}
      POSTGRESQL_PASSWORD_FILE: /run/secrets/postgres_password
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-smart_water_map}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$(cat /run/secrets/postgres_password) psql -h 127.0.0.1 -p 6432 -U $${POSTGRESQL_USERNAME:-smart_water} -d $${POSTGRESQL_DATABASE:-smart_water_map} -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_direct_url
      DIRECT_URL_FILE: /run/secrets/database_direct_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
    secrets:
      - database_direct_url
      - jwt_secret
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "export DATABASE_URL=\"$$(cat /run/secrets/database_direct_url)\" DIRECT_URL=\"$$(cat /run/secrets/database_direct_url)\" JWT_SECRET=\"$$(cat /run/secrets/jwt_secret)\" && npm run deploy:migrations"]

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL_FILE: /run/secrets/database_pool_url
      DIRECT_URL_FILE: /run/secrets/database_direct_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      AFRICASTALKING_API_KEY_FILE: /run/secrets/africastalking_api_key
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      SENSOR_PROVIDER_URL: ${SENSOR_PROVIDER_URL:-}
      SENSOR_PROVIDER_API_KEY_FILE: /run/secrets/sensor_provider_api_key
      SENSOR_PROVIDER_MODE: ${SENSOR_PROVIDER_MODE:-generic_http}
      WHATSAPP_PROVIDER_URL: ${WHATSAPP_PROVIDER_URL:-}
      WHATSAPP_PROVIDER_TOKEN_FILE: /run/secrets/whatsapp_provider_token
      WHATSAPP_WEBHOOK_SECRET_FILE: /run/secrets/whatsapp_webhook_secret
      TWILIO_AUTH_TOKEN_FILE: /run/secrets/twilio_auth_token
      AFRICASTALKING_WEBHOOK_TOKEN_FILE: /run/secrets/africastalking_webhook_token
      IVR_PROVIDER_URL: ${IVR_PROVIDER_URL:-}
      IVR_PROVIDER_TOKEN_FILE: /run/secrets/ivr_provider_token
      MARKET_PRICE_API_URL: ${MARKET_PRICE_API_URL:-}
      MARKET_PRICE_API_KEY_FILE: /run/secrets/market_price_api_key
      MARKET_PRICE_PROVIDER: ${MARKET_PRICE_PROVIDER:-generic}
      UPLOAD_PROVIDER: ${UPLOAD_PROVIDER:-s3}
      UPLOAD_SIGNED_URL_TTL_SECONDS: ${UPLOAD_SIGNED_URL_TTL_SECONDS:-900}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      IMAGE_MODERATION_URL: ${IMAGE_MODERATION_URL:-}
      IMAGE_MODERATION_API_KEY_FILE: /run/secrets/image_moderation_api_key
      OPERATIONAL_ALERT_WEBHOOK_URL_FILE: /run/secrets/operational_alert_webhook_url
    secrets:
      - database_pool_url
      - database_direct_url
      - jwt_secret
      - africastalking_api_key
      - sensor_provider_api_key
      - whatsapp_provider_token
      - whatsapp_webhook_secret
      - twilio_auth_token
      - africastalking_webhook_token
      - ivr_provider_token
      - market_price_api_key
      - s3_access_key_id
      - s3_secret_access_key
      - image_moderation_api_key
      - operational_alert_webhook_url
    ports:
      - "${SERVER_BIND:-127.0.0.1:4001}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    image: ${CLIENT_IMAGE:?CLIENT_IMAGE is required}
    restart: unless-stopped
    ports:
      - "${CLIENT_BIND:-127.0.0.1:5174}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

secrets:
  postgres_password:
    external: true
  database_pool_url:
    external: true
  database_direct_url:
    external: true
  jwt_secret:
    external: true
  africastalking_api_key:
    external: true
  sensor_provider_api_key:
    external: true
  whatsapp_provider_token:
    external: true
  whatsapp_webhook_secret:
    external: true
  twilio_auth_token:
    external: true
  africastalking_webhook_token:
    external: true
  ivr_provider_token:
    external: true
  market_price_api_key:
    external: true
  s3_access_key_id:
    external: true
  s3_secret_access_key:
    external: true
  image_moderation_api_key:
    external: true
  operational_alert_webhook_url:
    external: true
